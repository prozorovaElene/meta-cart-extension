<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unified Cart</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="icons/icon48.png" alt="" width="24" height="24" />
      <h1>Unified Cart</h1>
    </div>

    <div id="signedOutView" class="view">
      <p class="muted">Sign in to start capturing "add to cart" clicks across any shopping site.</p>
      <button id="signInBtn" class="primary">Sign in</button>
    </div>

    <div id="signedInView" class="view hidden">
      <div class="status">
        <span class="dot"></span>
        <span>Connected — capturing add-to-cart clicks</span>
      </div>
      <button id="signOutBtn" class="secondary">Sign out</button>
    </div>

    <div id="errorBox" class="error hidden"></div>

    <div class="footer">
      <a href="#" id="optionsLink">Backend settings</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
