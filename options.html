<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unified Cart — Settings</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 40px auto; color: #111827; }
    h1 { font-size: 18px; }
    label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; }
    input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 12px; }
    button { padding: 8px 16px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .saved { color: #16a34a; font-size: 13px; margin-left: 10px; display: none; }
    .hint { color: #6b7280; font-size: 12px; margin-top: -6px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Backend settings</h1>
  <label for="backendUrl">Backend base URL</label>
  <input id="backendUrl" type="url" placeholder="http://localhost:8080" />
  <p class="hint">Used for both sign-in (/extension/authorize) and item capture (/api/cart-items). Change this while developing/testing your backend.</p>
  <button id="saveBtn">Save</button>
  <span id="savedMsg" class="saved">Saved ✓</span>

  <script src="options.js"></script>
</body>
</html>
